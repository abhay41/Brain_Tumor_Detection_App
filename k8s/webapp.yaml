apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: brain-tumor-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: abhay41/brain_tumor_app:latest
        env:
        - name: MYSQL_USER
          value: "root"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_HOST
          value: "mysql-service.brain-tumor-app.svc.cluster.local"  # Use full DNS
        - name: MYSQL_DB
          value: "brain_tumor_db"
        - name: FLASK_ENV
          value: "production"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
        - name: GUNICORN_WORKERS
          value: "4"  # Optimized worker count
        - name: GUNICORN_TIMEOUT
          value: "120"  # Increased timeout
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: uploads
          mountPath: /app/app/static/uploads
        readinessProbe:
          httpGet:
            path: /health  # Add a health check endpoint
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        command: ["gunicorn", "--workers", "2", "--bind", "0.0.0.0:5000", "run:app"]
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: brain-tumor-app
spec:
  type: LoadBalancer  # Changed to LoadBalancer for EC2 access
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000